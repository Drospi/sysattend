version: "3.9"

services:
  # ── Backend FastAPI ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sysattend_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sysattend:sysattend123@db:5432/sysattend_db
      - SECRET_KEY=${SECRET_KEY:-sysattend-secret-key-cambiar}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:80"]
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sysattend_net

  # ── Frontend React ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sysattend_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sysattend_net

  # ── PostgreSQL ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sysattend_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sysattend
      POSTGRES_PASSWORD: sysattend123
      POSTGRES_DB: sysattend_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysattend -d sysattend_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sysattend_net

  # ── Nginx Proxy (producción) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sysattend_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sysattend_net
    profiles:
      - production

volumes:
  postgres_data:

networks:
  sysattend_net:
    driver: bridge
